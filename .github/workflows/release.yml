# Release (MVP 2, 5.2): every merge into develop whose CI passes becomes a version, vMAJOR.MINOR.PATCH, with a GitHub
# Release (.github/scripts/next-version.sh: feat → minor, fix and the rest → patch, "!" or BREAKING CHANGE → major).
# The website is built once, for that version, and the build is attached to the release, then deployed to dev
# (deploy.yml). test and prod serve that same build later, through controller.yaml (5.4): the API address comes from
# the address the site is served at (src/lib/env.ts).
name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Version
    # A push to develop whose CI passed, or a manual run on develop.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # the version tag and its GitHub Release
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Exactly the commit CI tested, with every tag, to find the latest version.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Work out the version
        id: version
        env:
          COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          version="$(bash .github/scripts/next-version.sh "$COMMIT")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "### $version" >> "$GITHUB_STEP_SUMMARY"

      - name: Tag it and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT: ${{ steps.version.outputs.commit }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "$VERSION is already released."
            exit 0
          fi
          previous="$(git tag --merged "$COMMIT^" --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
          # A pre-release until it reaches production (controller.yaml, 5.4); the notes list the PRs since the last one.
          gh release create "$VERSION" --target "$COMMIT" --title "$VERSION" --prerelease \
            --generate-notes ${previous:+--notes-start-tag "$previous"}

  build:
    name: Build the website once
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # attach the build to the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.version.outputs.commit }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
        run: npm run build

      # Public pages as finished HTML for search engines and partners, plus sitemap.xml and robots.txt (5.7).
      - name: Pre-render the public pages
        run: |
          npx playwright install --with-deps chromium
          node scripts/prerender.mjs

      - name: Attach the build to the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          (cd dist && zip -qr "../goawaygo-web-$VERSION.zip" .)
          gh release upload "$VERSION" "goawaygo-web-$VERSION.zip" --clobber

  dev:
    name: Deploy to dev
    needs: [version, build]
    if: vars.CLOUDFLARE_ACCOUNT_ID != ''
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      environment: dev
      version: ${{ needs.version.outputs.version }}

  record:
    name: Record the dev deploy
    needs: [version, dev]
    if: always() && needs.version.result == 'success' && needs.dev.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # the release notes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.version.outputs.commit }}

      - name: Record it in the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          RESULT: ${{ needs.dev.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/record-deployment.sh "$VERSION" dev "$RESULT" "$RUN_URL"

  tests:
    name: Tests on dev
    needs: [version, dev]
    if: needs.dev.result == 'success'
    permissions:
      contents: write # the results in the release notes
    uses: ./.github/workflows/tests.yml
    secrets: inherit
    with:
      environment: dev
      version: ${{ needs.version.outputs.version }}
