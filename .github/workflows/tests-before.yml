name: Tests before merge

# "Before" evidence for every pull request (MVP 2, 5.5/5.6): the smoke tests against dev (the website as it is before this change), kept as a report on the
# pull request. Not a required check: if dev itself is broken, the fix must still be mergeable. The "after" evidence
# is the full run once the merged version is deployed to dev (Release → Tests).
on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke tests on dev
    # Dependabot's pull requests get no secrets; the smoke tests don't need them.
    # tests.yml's recording job asks for write access, and GitHub won't start a called workflow that asks for more than
    # its caller grants, even for a job that is skipped. Pull request runs have no version and never record anything.
    permissions:
      contents: write
    uses: ./.github/workflows/tests.yml
    secrets: inherit
    with:
      environment: dev
      scope: smoke
