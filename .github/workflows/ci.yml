name: CI

on:
  pull_request:
  push:
    branches: [main, test, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Typecheck, lint, format, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, lint, format check, build
        run: npm run check

      # The release pre-renders the public pages (5.7): a page that can't render fails here first.
      - name: Pre-render the public pages
        run: |
          npx playwright install --with-deps chromium
          node scripts/prerender.mjs
