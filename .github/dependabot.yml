# Weekly dependency update PRs into develop. Minor/patch updates are grouped into one PR to keep noise low;
# major updates get their own PR because they can break things.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Keep Node type definitions on the same major as the runtime in .nvmrc (Node 24).
      # Bump this together with .nvmrc when upgrading Node.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # typescript-eslint does not support TypeScript 7 yet (npm ERESOLVE).
      # Remove once typescript-eslint supports it, then upgrade both together.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'chore(ci)'
    groups:
      github-actions:
        patterns: ['*']
